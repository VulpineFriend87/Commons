metadata.format.version = "1.1"

[versions]

# Adventure
# Compiled against the oldest supported platform. Paper 1.18.2 brings adventure-bom 4.11.0,
# which is the first version with MiniMessage and TagResolver in the Paper API.
# Velocity ships 4.25.0, so 4.11.0 is the floor across both.
adventure = "4.11.0"

# Testing
junit = "6.1.2"

[libraries]

# CompileOnly Dependencies
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-logger = { module = "net.kyori:adventure-text-logger-slf4j", version.ref = "adventure" }

# Testing
junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
